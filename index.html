<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;font:13px system-ui,sans-serif;user-select:none}
  #frame{position:absolute;inset:0;border-radius:36px;overflow:hidden;cursor:move}
  #hole{position:absolute;left:14px;right:14px;top:44px;bottom:14px;border-radius:22px;
        box-shadow:0 0 0 3000px #36393b;overflow:hidden}
  .tr{position:absolute;background:rgba(20,22,24,.9);color:#fff;border-radius:4px;padding:1px 3px;box-sizing:border-box;overflow:hidden;line-height:1.15}
  .pill{position:absolute;top:6px;height:32px;background:#fff;border-radius:16px;display:flex;align-items:center;cursor:default}
  #langs{left:8px;padding:0 6px;gap:2px}
  #btns{right:10px;padding:0 4px;gap:4px}
  select{border:0;background:transparent;font:inherit;outline:none;cursor:pointer}
  .btn{width:24px;height:24px;border-radius:50%;background:#36393b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer}
  #status{position:absolute;top:14px;left:200px;right:130px;color:#aeb4b8;font-size:11px;text-align:center;pointer-events:none;white-space:nowrap;overflow:hidden}
  #grip{position:absolute;right:5px;bottom:1px;color:#fff;font-size:12px;cursor:nwse-resize}
</style></head>
<body>
<div id="frame">
  <div id="hole"></div>
  <div class="pill" id="langs">
    <select id="src"><option value="en">English</option><option value="ru">Русский</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option><option value="zh">中文</option><option value="ja">日本語</option></select>→
    <select id="tgt"><option value="ru">Русский</option><option value="en">English</option></select>
  </div>
  <div id="status"></div>
  <div class="pill" id="btns">
    <div class="btn" id="eng" title="Движок: Google / офлайн">G</div>
    <div class="btn" id="pz" title="Пауза">❚❚</div>
    <div class="btn" id="x" title="Закрыть">✕</div>
  </div>
  <div id="grip">◢</div>
</div>
<script>
const B=14,H=44,$=(i)=>document.getElementById(i);
let ignoring=true,drag=null,engine='google',paused=false;

window.addEventListener('mousemove',e=>{
  if(drag){api.drag({phase:'move',mode:drag.mode,dx:e.screenX-drag.x,dy:e.screenY-drag.y});return}
  const inHole=e.clientX>B&&e.clientX<innerWidth-B&&e.clientY>H&&e.clientY<innerHeight-B;
  if(inHole!==ignoring){ignoring=inHole;api.ignore(inHole)}
});
$('frame').addEventListener('mousedown',e=>{
  if(e.target.closest('select,.btn'))return;
  const mode=e.target.closest('#grip')?'resize':'move';
  drag={mode,x:e.screenX,y:e.screenY};api.drag({phase:'start'});$('hole').innerHTML='';e.preventDefault();
});
window.addEventListener('mouseup',()=>{if(drag){drag=null;api.drag({phase:'end'})}});

const push=()=>{$('hole').innerHTML='';api.set({engine,src:$('src').value,tgt:$('tgt').value})};
$('src').onchange=push;$('tgt').onchange=push;
$('eng').onclick=()=>{engine=engine==='google'?'offline':'google';$('eng').textContent=engine==='google'?'G':'⚡';
  $('eng').title=engine==='google'?'Google (онлайн)':'Офлайн-модель';push()};
$('pz').onclick=()=>{paused=!paused;$('pz').textContent=paused?'▶':'❚❚';api.pause(paused);if(paused)$('hole').innerHTML=''};
$('x').onclick=()=>api.close();

api.on('status',t=>$('status').textContent=t);
api.on('result',items=>{
  const h=$('hole');h.innerHTML='';
  for(const it of items){
    const d=document.createElement('div');d.className='tr';d.textContent=it.text;
    d.style.cssText+=`left:${it.x}px;top:${it.y}px;width:${it.w+8}px;min-height:${it.h}px;font-size:${Math.max(10,Math.min(it.lh*.8,30))}px`;
    h.appendChild(d);
  }
});
api.set({engine,src:'en',tgt:'ru'});
</script></body></html>
